<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinIA — Conocerte</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1f44;--blue:#1a56db;--sky:#e8f0fe;
  --text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--bg:#f9fafb;--bg2:#fff;
  --green:#059669;--green-dim:#ecfdf5;
  --amber:#d97706;--amber-dim:#fffbeb;
  --coral:#dc2626;--coral-dim:#fef2f2;
  --teal:#0d9488;--teal-dim:#f0fdfa;
  --purple:#7c3aed;--purple-dim:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:18px;font-weight:800;color:#fff}.brand span{color:#60a5fa}
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-text{font-size:11px;color:rgba(255,255,255,.5);font-weight:600}
.prog-dots{display:flex;gap:4px}
.pd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.pd.done{background:rgba(255,255,255,.5)}
.pd.active{background:#60a5fa;transform:scale(1.3)}

/* CHAT AREA */
.chat-area{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

/* AGENT BUBBLE */
.msg-agent{display:flex;gap:9px;align-items:flex-end;animation:fadeUp .3s ease}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble-agent{background:var(--navy);color:#fff;border-radius:18px 18px 18px 4px;padding:13px 16px;font-size:14px;line-height:1.65;max-width:88%}
.bubble-agent strong{color:#60a5fa}
.bubble-agent .small{font-size:12px;color:rgba(255,255,255,.55);margin-top:4px}

/* TYPING */
.typing{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* USER BUBBLE */
.msg-user{display:flex;justify-content:flex-end;animation:fadeUp .25s ease}
.bubble-user{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px;padding:11px 16px;font-size:14px;max-width:80%;line-height:1.5}

/* INTEGRATION CARD */
.int-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:fadeUp .3s ease}
.int-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);transition:all .3s}
.int-row:last-child{border-bottom:none}
.int-icon{font-size:20px;flex-shrink:0}
.int-info{flex:1}
.int-name{font-size:13px;font-weight:700;color:var(--text)}
.int-detail{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.int-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.ib-load{background:var(--amber-dim);color:var(--amber)}
.ib-ok{background:var(--green-dim);color:var(--green)}
.ib-na{background:var(--bg);color:var(--muted);border:1px solid var(--border)}

/* CHIPS */
.chips-wrap{animation:fadeUp .3s ease}
.chips-label{font-size:12px;color:var(--muted);margin-bottom:8px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:50px;border:2px solid var(--border);background:var(--bg2);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--blue);background:var(--sky)}
.chip.selected{border-color:var(--blue);background:var(--blue);color:#fff}
.chip-emoji{font-size:16px}

/* MULTI CHIPS */
.multi-chips .chip.selected{background:var(--sky);color:var(--blue);border-color:var(--blue)}
.confirm-btn{margin-top:10px;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:50px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:none;transition:all .15s}
.confirm-btn.show{display:inline-flex;align-items:center;gap:5px}

/* RESULT CARD */
.result-card{background:linear-gradient(135deg,var(--navy) 0%,#1a3a6b 100%);border-radius:16px;padding:16px 18px;animation:fadeUp .3s ease}
.rc-label{font-size:11px;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.rc-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.rc-item:last-child{border-bottom:none}
.rc-emoji{font-size:15px;flex-shrink:0}
.rc-text{font-size:13px;color:rgba(255,255,255,.85)}
.rc-text strong{color:#60a5fa}

/* SLIDER */
.slider-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;animation:fadeUp .3s ease}
.sl-val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-1px;margin-bottom:12px}
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--border);outline:none;margin-bottom:6px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)}
.sl-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px}
.sl-confirm{padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:50px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* FOOTER */
.chat-footer{padding:12px 16px 28px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.footer-hint{font-size:12px;color:var(--muted);text-align:center}

/* DONE BTN */
.done-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.done-btn:hover{background:#1e63f0}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">Fin<span>IA</span></div>
  <div class="prog-wrap">
    <div class="prog-text" id="prog-text">Paso 1 de 7</div>
    <div class="prog-dots" id="prog-dots"></div>
  </div>
</div>

<!-- CHAT -->
<div class="chat-area" id="chat"></div>

<!-- FOOTER -->
<div class="chat-footer" id="chat-footer">
  <div class="footer-hint" id="footer-hint">Tocá una opción para responder</div>
</div>

<script>
const STEPS = 7;
let currentStep = 0;
const answers = {};
const chat = document.getElementById('chat');
const footer = document.getElementById('chat-footer');

// Helpers
function scrollBottom(){ setTimeout(()=>chat.scrollTo({top:99999,behavior:'smooth'}),100) }

function setProgress(step){
  document.getElementById('prog-text').textContent=`Paso ${step} de ${STEPS}`;
  const d=document.getElementById('prog-dots');
  d.innerHTML='';
  for(let i=1;i<=STEPS;i++){
    const dot=document.createElement('div');
    dot.className='pd'+(i<step?' done':i===step?' active':'');
    d.appendChild(dot);
  }
}

function addAgentBubble(html, delay=0){
  return new Promise(res=>{
    // typing indicator
    const typing=document.createElement('div');
    typing.className='msg-agent';
    typing.innerHTML=`<div class="av">F</div><div class="bubble-agent"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(typing);
    scrollBottom();
    setTimeout(()=>{
      typing.remove();
      const msg=document.createElement('div');
      msg.className='msg-agent';
      msg.innerHTML=`<div class="av">F</div><div class="bubble-agent">${html}</div>`;
      chat.appendChild(msg);
      scrollBottom();
      res();
    }, delay+600);
  });
}

function addUserBubble(text){
  const msg=document.createElement('div');
  msg.className='msg-user';
  msg.innerHTML=`<div class="bubble-user">${text}</div>`;
  chat.appendChild(msg);
  scrollBottom();
}

function addElement(el, delay=0){
  return new Promise(res=>{
    setTimeout(()=>{
      chat.appendChild(el);
      scrollBottom();
      res();
    }, delay);
  });
}

function clearFooter(){
  footer.innerHTML='';
}

// STEP RUNNER
async function runStep(step){
  setProgress(step);
  currentStep=step;

  if(step===1) await step1();
  else if(step===2) await step2();
  else if(step===3) await step3();
  else if(step===4) await step4();
  else if(step===5) await step5();
  else if(step===6) await step6();
  else if(step===7) await step7();
  else await stepDone();
}

// STEP 1 — CUIL / CUIT
async function step1(){
  await addAgentBubble(`Hola! 👋 Soy <strong>FinIA</strong>, tu asesor financiero personal. Voy a hacerte 7 preguntas cortas para conocerte y darte las mejores recomendaciones.<br><div class="small">Menos de 3 minutos — prometido.</div>`, 200);
  await addAgentBubble(`Empecemos por lo básico: ¿cómo es tu situación fiscal?`, 800);

  const wrap=document.createElement('div');
  wrap.className='chips-wrap';
  wrap.innerHTML=`
    <div class="chips">
      <div class="chip" onclick="pickChip(this,'tipo','cuil_solo','Solo CUIL')"><span class="chip-emoji">👤</span>Solo CUIL</div>
      <div class="chip" onclick="pickChip(this,'tipo','cuit_solo','Solo CUIT')"><span class="chip-emoji">📊</span>Solo CUIT</div>
      <div class="chip" onclick="pickChip(this,'tipo','cuil_cuit','CUIL + CUIT ⭐')"><span class="chip-emoji">⭐</span>CUIL y CUIT</div>
    </div>`;
  await addElement(wrap, 400);
}

// STEP 2 — Situación laboral
async function step2(){
  const label={cuil_solo:'Solo CUIL',cuit_solo:'Solo CUIT',cuil_cuit:'CUIL y CUIT'}[answers.tipo];
  addUserBubble(label);
  await addAgentBubble(`Entendido! ${answers.tipo==='cuil_cuit'?'El perfil más completo — personal y comercial en un solo lugar. 💪':''}<br>¿Cuál es tu situación laboral y comercial?`, 600);

  const wrap=document.createElement('div');
  wrap.className='chips-wrap';
  wrap.innerHTML=`
    <div class="chips-label">Podés elegir más de uno</div>
    <div class="chips multi-chips" id="chips-sit">
      <div class="chip" data-val="dependencia" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">👔</span>Empleado</div>
      <div class="chip" data-val="monotributo" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">🟢</span>Monotributista</div>
      <div class="chip" data-val="ri" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">📊</span>Resp. Inscripto</div>
      <div class="chip" data-val="sociedad" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">🏢</span>Tengo sociedad</div>
      <div class="chip" data-val="estudiante" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">🎓</span>Estudiante</div>
      <div class="chip" data-val="jubilado" onclick="toggleMulti(this,'sit')"><span class="chip-emoji">🏖️</span>Jubilado</div>
    </div>
    <button class="confirm-btn" id="confirm-sit" onclick="confirmMulti('sit','situacion')">Confirmar →</button>`;
  await addElement(wrap, 400);
}

// STEP 3 — Integraciones ARCA/RENAPER/ANSES
async function step3(){
  const sits=answers.situacion||[];
  const sitLabels=sits.map(s=>({dependencia:'Empleado',monotributo:'Monotributista',ri:'Resp. Inscripto',sociedad:'Con sociedad',estudiante:'Estudiante',jubilado:'Jubilado'}[s]||s));
  addUserBubble(sitLabels.join(' · ')||'Varios');

  const hasRI=answers.tipo==='cuit_solo'||answers.tipo==='cuil_cuit';
  const hasDep=sits.includes('dependencia');

  await addAgentBubble(`Perfecto! Ahora voy a consultar tus datos en los registros oficiales. Con tu CUIL/CUIT puedo pre-llenar tu perfil sin que tengas que escribir nada. 🔗`, 600);

  const card=document.createElement('div');
  card.className='int-card';
  card.innerHTML=`
    <div class="int-row" id="ir-renaper">
      <div class="int-icon">🪪</div>
      <div class="int-info"><div class="int-name">RENAPER — Identidad</div><div class="int-detail">Nombre, DNI, domicilio</div></div>
      <div class="int-badge ib-load">Consultando...</div>
    </div>
    <div class="int-row" id="ir-arca">
      <div class="int-icon">🏛️</div>
      <div class="int-info"><div class="int-name">ARCA — Situación fiscal</div><div class="int-detail">Impuestos, actividades, vencimientos</div></div>
      <div class="int-badge ib-load">Consultando...</div>
    </div>
    <div class="int-row" id="ir-anses">
      <div class="int-icon">👴</div>
      <div class="int-info"><div class="int-name">ANSES — Historia laboral</div><div class="int-detail">Aportes, beneficios, relación de dependencia</div></div>
      <div class="int-badge ib-load">Consultando...</div>
    </div>`;
  await addElement(card, 300);

  // Simular respuestas
  await new Promise(res=>{
    setTimeout(()=>{
      const r=document.getElementById('ir-renaper');
      r.querySelector('.int-badge').className='int-badge ib-ok';
      r.querySelector('.int-badge').textContent='Verificado ✓';
      r.querySelector('.int-detail').textContent='Identidad confirmada · Domicilio CABA';
      res();
    },1400);
  });
  await new Promise(res=>{
    setTimeout(()=>{
      const r=document.getElementById('ir-arca');
      r.querySelector('.int-badge').className='int-badge ib-ok';
      r.querySelector('.int-badge').textContent='Verificado ✓';
      r.querySelector('.int-detail').textContent=hasRI?'RI desde 2016 · IVA · IIBB · Ganancias · Autónomos':'CUIL activo · Sin obligaciones propias';
      res();
    },2400);
  });
  await new Promise(res=>{
    setTimeout(()=>{
      const r=document.getElementById('ir-anses');
      r.querySelector('.int-badge').className=hasDep?'int-badge ib-ok':'int-badge ib-na';
      r.querySelector('.int-badge').textContent=hasDep?'Verificado ✓':'No aplica';
      r.querySelector('.int-detail').textContent=hasDep?'Relación de dependencia activa · Aportes al día':'No se encontraron aportes en relación de dependencia';
      res();
    },3200);
  });

  await new Promise(res=>setTimeout(res,400));

  const resultItems=[
    {e:'🪪',t:'Identidad verificada'},
    {e:'🏛️',t:hasRI?'<strong>RI activo</strong> · IVA + IIBB + Ganancias':'CUIL activo'},
    {e:'📋',t:`Módulos activados: ${hasRI?'Taxation completo':'Dashboard personal'}${hasDep?', Historia laboral':''}${sits.includes('sociedad')?', Dashboard pyme':''}`},
  ];
  if(hasDep) resultItems.splice(2,0,{e:'👴',t:'Historia laboral ANSES verificada'});

  const rc=document.createElement('div');
  rc.className='result-card';
  rc.innerHTML=`<div class="rc-label">Lo que encontré de vos</div>${resultItems.map(i=>`<div class="rc-item"><div class="rc-emoji">${i.e}</div><div class="rc-text">${i.t}</div></div>`).join('')}`;

  await addAgentBubble(`¡Todo verificado! 🎉 Ya sé quién sos y qué módulos activarte. Sigamos con un par de preguntas más.`, 600);
  await addElement(rc, 200);
  await new Promise(res=>setTimeout(res,600));
  runStep(4);
}

// STEP 4 — Ingresos
async function step4(){
  await addAgentBubble(`¿Cuánto entra por mes aproximadamente? Incluí todo — sueldo, honorarios, alquileres.`, 400);

  const card=document.createElement('div');
  card.className='slider-card';
  const amounts=[0,100000,200000,300000,400000,500000,600000,700000,800000,900000,1000000,1200000,1500000,1800000,2000000,2500000,3000000,4000000,5000000,7000000,10000000];
  card.innerHTML=`
    <div class="sl-val" id="sl-val">$500.000</div>
    <input type="range" class="slider" id="sl" min="0" max="20" value="5" oninput="
      const a=[0,100000,200000,300000,400000,500000,600000,700000,800000,900000,1000000,1200000,1500000,1800000,2000000,2500000,3000000,4000000,5000000,7000000,10000000];
      document.getElementById('sl-val').textContent='$'+a[this.value].toLocaleString('es-AR');
    ">
    <div class="sl-labels"><span>$0</span><span>$10M+</span></div>
    <button class="sl-confirm" onclick="confirmSlider()">Confirmar →</button>`;
  await addElement(card, 300);
}

function confirmSlider(){
  const v=parseInt(document.getElementById('sl').value);
  const amounts=[0,100000,200000,300000,400000,500000,600000,700000,800000,900000,1000000,1200000,1500000,1800000,2000000,2500000,3000000,4000000,5000000,7000000,10000000];
  answers.monto=amounts[v];
  const label=v===0?'Prefiero no decirlo':'$'+amounts[v].toLocaleString('es-AR')+'/mes';
  document.querySelector('.slider-card').remove();
  addUserBubble(label);
  setTimeout(()=>runStep(5),400);
}

// STEP 5 — Gastos
async function step5(){
  await addAgentBubble(`¿Cuáles son tus gastos más importantes? Seleccioná todos los que aplican.`, 400);

  const wrap=document.createElement('div');
  wrap.className='chips-wrap';
  wrap.innerHTML=`
    <div class="chips multi-chips" id="chips-gastos">
      <div class="chip" data-val="vivienda" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🏠</span>Vivienda</div>
      <div class="chip" data-val="educacion" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🎓</span>Educación</div>
      <div class="chip" data-val="salud" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🏥</span>Salud</div>
      <div class="chip" data-val="seguros" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🛡️</span>Seguros</div>
      <div class="chip" data-val="supermercado" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🛒</span>Supermercado</div>
      <div class="chip" data-val="tarjetas" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">💳</span>Tarjetas</div>
      <div class="chip" data-val="servicios" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">📱</span>Servicios digitales</div>
      <div class="chip" data-val="club" onclick="toggleMulti(this,'gastos')"><span class="chip-emoji">🏌️</span>Club / Ocio</div>
    </div>
    <button class="confirm-btn" id="confirm-gastos" onclick="confirmMulti('gastos','gastos')">Confirmar →</button>`;
  await addElement(wrap, 400);
}

// STEP 6 — Documentos
async function step6(){
  const gastos=answers.gastos||[];
  addUserBubble(gastos.map(g=>({vivienda:'🏠 Vivienda',educacion:'🎓 Educación',salud:'🏥 Salud',seguros:'🛡️ Seguros',supermercado:'🛒 Supermercado',tarjetas:'💳 Tarjetas',servicios:'📱 Servicios',club:'🏌️ Club'}[g]||g)).join(' · ')||'Varios');
  await addAgentBubble(`Perfecto. ¿Tenés algún documento para subir? Con un resumen de tarjeta o extracto bancario tu dashboard queda completo desde el primer día.`, 600);

  const wrap=document.createElement('div');
  wrap.className='chips-wrap';
  wrap.innerHTML=`
    <div class="chips">
      <div class="chip" onclick="pickChip(this,'docs','ahora','📸 Subo ahora')"><span class="chip-emoji">📸</span>Subo ahora</div>
      <div class="chip" onclick="pickChip(this,'docs','despues','⏰ Lo hago después')"><span class="chip-emoji">⏰</span>Lo hago después</div>
      <div class="chip" onclick="pickChip(this,'docs','manual','✏️ Cargo a mano')"><span class="chip-emoji">✏️</span>Cargo a mano</div>
    </div>`;
  await addElement(wrap, 400);
}

// STEP 7 — Inversión
async function step7(){
  const docsLabel={ahora:'📸 Subo ahora',despues:'⏰ Lo hago después',manual:'✏️ Cargo a mano'}[answers.docs];
  addUserBubble(docsLabel||'Lo hago después');
  await addAgentBubble(`Última pregunta, te lo juro 😄 ¿Cómo es tu relación con las inversiones?`, 600);

  const wrap=document.createElement('div');
  wrap.className='chips-wrap';
  wrap.innerHTML=`
    <div class="chips">
      <div class="chip" onclick="pickChip(this,'inv','nunca','🌱 Nunca invertí')"><span class="chip-emoji">🌱</span>Nunca invertí</div>
      <div class="chip" onclick="pickChip(this,'inv','basico','📦 Algo básico')"><span class="chip-emoji">📦</span>Algo básico</div>
      <div class="chip" onclick="pickChip(this,'inv','activo','📈 Inversión activa')"><span class="chip-emoji">📈</span>Inversión activa</div>
    </div>`;
  await addElement(wrap, 400);
}

// DONE
async function stepDone(){
  const invLabel={nunca:'🌱 Nunca invertí',basico:'📦 Algo básico',activo:'📈 Inversión activa'}[answers.inv];
  addUserBubble(invLabel||'Algo básico');

  const hasRI=answers.tipo==='cuit_solo'||answers.tipo==='cuil_cuit';
  const hasSoc=(answers.situacion||[]).includes('sociedad');

  await addAgentBubble(`¡Listo! 🎉 Ya armé tu perfil completo. Tu dashboard está configurado con todo lo que necesitás.`, 600);

  const profileItems=[
    {e:'✅',t:'Identidad verificada vía RENAPER'},
    {e:'🏛️',t:hasRI?'Taxation completo activado (IVA · IIBB · Ganancias)':'Dashboard personal activado'},
    {e:'📊',t:'Categorías de gasto configuradas'},
    {e:'📈',t:answers.inv==='nunca'?'Inversión básica — te vamos a enseñar':'Motor de inversión activado'},
  ];
  if(hasSoc) profileItems.push({e:'🏢',t:'Dashboard de negocio activado'});

  const rc=document.createElement('div');
  rc.className='result-card';
  rc.innerHTML=`<div class="rc-label">Tu perfil está listo</div>${profileItems.map(i=>`<div class="rc-item"><div class="rc-emoji">${i.e}</div><div class="rc-text">${i.t}</div></div>`).join('')}`;
  await addElement(rc, 200);

  await new Promise(res=>setTimeout(res,600));

  const btn=document.createElement('button');
  btn.className='done-btn';
  btn.textContent='Ir a mi dashboard →';
  btn.onclick=()=>window.location.href='finia_dashboard.html';
  await addElement(btn, 300);

  if(hasSoc){
    await new Promise(res=>setTimeout(res,200));
    const btn2=document.createElement('button');
    btn2.className='done-btn';
    btn2.style.cssText='margin-top:8px;background:rgba(26,86,219,.12);color:var(--blue);border:1px solid var(--border)';
    btn2.textContent='Ver mi negocio →';
    btn2.onclick=()=>window.location.href='finia_pyme.html';
    await addElement(btn2, 200);
  }

  footer.innerHTML=`<div class="footer-hint" style="color:var(--green);font-weight:600">¡Perfil completo! 🎉</div>`;
  setProgress(7);
}

// INTERACCIONES
function pickChip(el, key, val, label){
  el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  answers[key]=val;
  setTimeout(()=>{
    el.closest('.chips-wrap')?.remove();
    runStep(currentStep+1);
  },350);
}

function toggleMulti(el, group){
  el.classList.toggle('selected');
  const any=document.getElementById('chips-'+group).querySelector('.chip.selected');
  const btn=document.getElementById('confirm-'+group);
  if(btn) btn.className='confirm-btn'+(any?' show':'');
}

function confirmMulti(group, key){
  const selected=[...document.getElementById('chips-'+group).querySelectorAll('.chip.selected')].map(c=>c.dataset.val);
  answers[key]=selected;
  document.querySelector(`#chips-${group}`)?.closest('.chips-wrap')?.remove();
  runStep(currentStep+1);
}

// INIT
setProgress(1);
runStep(1);
</script>

<style>

.finia-tour-next{flex:1;padding:13px;background:#1a56db;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.finia-tour-skip{padding:13px 16px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
</style>

<div class="finia-tour-overlay" id="finia-tour-overlay">
  <div class="finia-tour-card">
    <div class="finia-tour-progress" id="finia-tour-progress"></div>
    <div class="finia-tour-step" id="finia-tour-step"></div>
    <div class="finia-tour-title" id="finia-tour-title"></div>
    <div class="finia-tour-body" id="finia-tour-body"></div>
    <div class="finia-tour-btns">
      <button class="finia-tour-skip" onclick="finiaTourEnd()">Salir del tour</button>
      <button class="finia-tour-next" id="finia-tour-next-btn" onclick="finiaTourNext()">Siguiente →</button>
    </div>
  </div>
</div>

<button class="finia-tour-fab" id="finia-tour-fab" onclick="finiaTourStart()">▶ Ver demo guiada</button>

<script>
const FINIA_TOUR_STEPS = [
  { page:'finia_onboarding.html', title:'1 · Te registrás', body:'Google, Apple, Microsoft o LinkedIn. <strong>Menos de 1 minuto</strong> — sin formularios largos.' },
  { page:'finia_welcome.html', title:'2 · FinIA te conoce', body:'Chat conversacional. Con tu CUIL/CUIT consultamos <strong>ARCA, RENAPER y ANSES</strong> para armar tu perfil sin que escribas nada.' },
  { page:'finia_dashboard.html', title:'3 · Tu balance, claro', body:'Un número grande: cuánto te sobra. Categorías, vencimientos e inversión del excedente — todo en una pantalla.' },
  { page:'finia_carga.html', title:'4 · Cargar es instantáneo', body:'Foto, chat, manual o archivo. <strong>FinIA lee, interpreta y lo suma a tu balance</strong> automáticamente.' },
  { page:'finia_consolidado.html', title:'5 · El consolidado', body:'Todo lo que entró y salió, por categoría y en línea de tiempo. <strong>El cierre del recorrido.</strong>' },
];

function finiaTourState(){
  try { return JSON.parse(localStorage.getItem('finia_tour')||'null'); }
  catch(e){ return null; }
}
function finiaTourSave(s){ localStorage.setItem('finia_tour', JSON.stringify(s)); }
function finiaTourClear(){ localStorage.removeItem('finia_tour'); }

function finiaTourStart(){
  finiaTourSave({ step: 0, active: true });
  finiaTourGoToStep(0);
}

function finiaTourGoToStep(i){
  const step = FINIA_TOUR_STEPS[i];
  const here = window.location.pathname.split('/').pop() || 'index.html';
  if(here !== step.page){
    window.location.href = step.page + '?tour=1';
    return;
  }
  finiaTourShowOverlay(i);
}

function finiaTourShowOverlay(i){
  const step = FINIA_TOUR_STEPS[i];
  document.getElementById('finia-tour-step').textContent = `Paso ${i+1} de ${FINIA_TOUR_STEPS.length}`;
  document.getElementById('finia-tour-title').textContent = step.title;
  document.getElementById('finia-tour-body').innerHTML = step.body;
  document.getElementById('finia-tour-next-btn').textContent = (i === FINIA_TOUR_STEPS.length-1) ? 'Terminar tour ✓' : 'Siguiente →';
  const prog = document.getElementById('finia-tour-progress');
  prog.innerHTML = '';
  FINIA_TOUR_STEPS.forEach((s,idx)=>{
    const d = document.createElement('div');
    d.className = 'finia-tour-dot' + (idx<i?' done':idx===i?' active':'');
    prog.appendChild(d);
  });
  document.getElementById('finia-tour-overlay').classList.add('show');
  document.getElementById('finia-tour-fab').classList.add('hide');
  finiaTourSave({ step: i, active: true });
}

function finiaTourNext(){
  const state = finiaTourState();
  const i = state ? state.step : 0;
  if(i >= FINIA_TOUR_STEPS.length - 1){
    const wasFromDemo = state && state.fromDemo;
    finiaTourEnd();
    if(wasFromDemo) window.location.href = 'finia_demo.html';
    return;
  }
  finiaTourGoToStep(i+1);
}

function finiaTourEnd(){
  finiaTourClear();
  const overlay = document.getElementById('finia-tour-overlay');
  const fab = document.getElementById('finia-tour-fab');
  if(overlay) overlay.classList.remove('show');
  if(fab) fab.classList.remove('hide');
}

(function(){
  const params = new URLSearchParams(window.location.search);
  const state = finiaTourState();
  if(params.get('tour')==='1' && state && state.active){
    window.addEventListener('DOMContentLoaded', ()=> finiaTourShowOverlay(state.step));
  }
})();
</script>
