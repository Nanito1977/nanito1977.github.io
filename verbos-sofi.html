<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbos Irregulares – Sofi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; color: #5c35b0; font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 20px; }

  .score-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .score-box { background: white; border-radius: 12px; padding: 10px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .score-box .num { font-size: 1.8rem; font-weight: bold; }
  .score-box .label { font-size: 0.75rem; color: #999; }
  .correct-num { color: #22c55e; }
  .wrong-num { color: #ef4444; }

  .card { background: white; border-radius: 16px; padding: 24px; max-width: 480px; margin: 0 auto 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .verb-question { font-size: 1.1rem; color: #444; margin-bottom: 14px; text-align: center; }
  .verb-question span { font-weight: bold; color: #5c35b0; font-size: 1.3rem; }

  .inputs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .input-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .input-group label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-group input {
    width: 130px; padding: 10px 12px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 1rem; text-align: center; outline: none;
    transition: border 0.2s;
  }
  .input-group input:focus { border-color: #5c35b0; }
  .input-group input.ok { border-color: #22c55e; background: #f0fdf4; }
  .input-group input.fail { border-color: #ef4444; background: #fef2f2; }

  .btn-check {
    display: block; margin: 16px auto 0; padding: 12px 32px;
    background: #5c35b0; color: white; border: none; border-radius: 12px;
    font-size: 1rem; cursor: pointer; transition: background 0.2s;
  }
  .btn-check:hover { background: #4a28a0; }
  .btn-check:disabled { background: #ccc; cursor: default; }

  .feedback { text-align: center; margin-top: 10px; font-size: 0.95rem; font-weight: 600; min-height: 20px; }
  .feedback.ok { color: #22c55e; }
  .feedback.fail { color: #ef4444; }

  .mode-btns { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .mode-btn { padding: 8px 18px; border-radius: 20px; border: 2px solid #5c35b0; background: white; color: #5c35b0; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .mode-btn.active { background: #5c35b0; color: white; }

  .progress-bar { max-width: 480px; margin: 0 auto 20px; background: #e0e0e0; border-radius: 10px; height: 8px; }
  .progress-fill { height: 8px; background: #5c35b0; border-radius: 10px; transition: width 0.3s; }

  .finish { text-align: center; padding: 30px; }
  .finish h2 { font-size: 2rem; margin-bottom: 10px; }
  .finish p { color: #666; margin-bottom: 20px; }
  .btn-restart { padding: 12px 32px; background: #5c35b0; color: white; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; }

  .cheat-sheet { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .cheat-sheet h3 { color: #5c35b0; margin-bottom: 10px; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #5c35b0; color: white; padding: 6px 8px; }
  td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; }
  tr:nth-child(even) td { background: #fafafa; }
</style>
</head>
<body>

<h1>✨ Verbos Irregulares</h1>
<p class="subtitle">Sofi — hasta <strong>choose</strong></p>

<div class="mode-btns">
  <button class="mode-btn active" onclick="setMode('practice')">🎯 Práctica</button>
  <button class="mode-btn" onclick="setMode('sheet')">📋 Ver lista</button>
</div>

<div id="practiceSection">
  <div class="score-bar">
    <div class="score-box"><div class="num correct-num" id="correctCount">0</div><div class="label">✅ Correctas</div></div>
    <div class="score-box"><div class="num wrong-num" id="wrongCount">0</div><div class="label">❌ Errores</div></div>
    <div class="score-box"><div class="num" id="totalCount">0/16</div><div class="label">Progreso</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="card" id="questionCard">
    <div class="verb-question">¿Cómo se conjuga <span id="verbDisplay"></span>?</div>
    <div class="inputs">
      <div class="input-group" id="group-past">
        <label>Past Simple</label>
        <input type="text" id="inputPast" placeholder="pasado..." autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="input-group" id="group-pp">
        <label>Past Participle</label>
        <input type="text" id="inputPP" placeholder="participio..." autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <button class="btn-check" id="btnCheck" onclick="checkAnswer()">Verificar</button>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div id="finishSection" style="display:none" class="finish">
  <h2 id="finishEmoji">🎉</h2>
  <h2 id="finishTitle"></h2>
  <p id="finishMsg"></p>
  <button class="btn-restart" onclick="restart()">Volver a intentar</button>
</div>

<div id="sheetSection" style="display:none" class="cheat-sheet">
  <h3>📋 Lista completa</h3>
  <table>
    <thead><tr><th>Infinitivo</th><th>Past Simple</th><th>Past Participle</th></tr></thead>
    <tbody id="sheetBody"></tbody>
  </table>
</div>

<script>
const verbs = [
  { inf: "be",     past: "was/were", pp: "been" },
  { inf: "beat",   past: "beat",     pp: "beaten" },
  { inf: "become", past: "became",   pp: "become" },
  { inf: "begin",  past: "began",    pp: "begun" },
  { inf: "bend",   past: "bent",     pp: "bent" },
  { inf: "bet",    past: "bet",      pp: "bet" },
  { inf: "bite",   past: "bit",      pp: "bitten" },
  { inf: "bleed",  past: "bled",     pp: "bled" },
  { inf: "blow",   past: "blew",     pp: "blown" },
  { inf: "break",  past: "broke",    pp: "broken" },
  { inf: "breed",  past: "bred",     pp: "bred" },
  { inf: "bring",  past: "brought",  pp: "brought" },
  { inf: "build",  past: "built",    pp: "built" },
  { inf: "buy",    past: "bought",   pp: "bought" },
  { inf: "catch",  past: "caught",   pp: "caught" },
  { inf: "choose", past: "chose",    pp: "chosen" },
];

let queue = [], current = null, correct = 0, wrong = 0, answered = 0;
let mode = 'practice';

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&m==='practice')||(i===1&&m==='sheet')));
  document.getElementById('practiceSection').style.display = m==='practice' ? 'block' : 'none';
  document.getElementById('sheetSection').style.display = m==='sheet' ? 'block' : 'none';
  document.getElementById('finishSection').style.display = 'none';
  if (m==='sheet') buildSheet();
}

function buildSheet() {
  const tb = document.getElementById('sheetBody');
  tb.innerHTML = verbs.map(v => `<tr><td><strong>${v.inf}</strong></td><td>${v.past}</td><td>${v.pp}</td></tr>`).join('');
}

function restart() {
  correct = 0; wrong = 0; answered = 0;
  queue = shuffle(verbs);
  document.getElementById('finishSection').style.display = 'none';
  document.getElementById('practiceSection').style.display = 'block';
  updateScore();
  nextVerb();
}

function nextVerb() {
  if (queue.length === 0) { showFinish(); return; }
  current = queue.shift();
  document.getElementById('verbDisplay').textContent = current.inf;
  document.getElementById('inputPast').value = '';
  document.getElementById('inputPP').value = '';
  document.getElementById('inputPast').className = '';
  document.getElementById('inputPP').className = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnCheck').disabled = false;
  document.getElementById('inputPast').focus();
}

function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g,'/').replace(/\//g,'/'); }

function checkAnswer() {
  const p = normalize(document.getElementById('inputPast').value);
  const pp = normalize(document.getElementById('inputPP').value);
  if (!p || !pp) return;

  const validPast = current.past.split('/').map(x=>x.trim().toLowerCase());
  const validPP = current.pp.split('/').map(x=>x.trim().toLowerCase());

  const okP = validPast.includes(p);
  const okPP = validPP.includes(pp);

  document.getElementById('inputPast').className = okP ? 'ok' : 'fail';
  document.getElementById('inputPP').className = okPP ? 'ok' : 'fail';

  answered++;
  const allOk = okP && okPP;
  if (allOk) { correct++; } else { wrong++; }

  const fb = document.getElementById('feedback');
  if (allOk) {
    fb.textContent = '¡Perfecto! 🌟';
    fb.className = 'feedback ok';
  } else {
    fb.textContent = `Respuesta: ${current.past} / ${current.pp}`;
    fb.className = 'feedback fail';
  }

  document.getElementById('btnCheck').disabled = true;
  updateScore();
  setTimeout(nextVerb, 1800);
}

function updateScore() {
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = answered + '/16';
  document.getElementById('progressFill').style.width = (answered/16*100)+'%';
}

function showFinish() {
  document.getElementById('practiceSection').style.display = 'none';
  document.getElementById('finishSection').style.display = 'block';
  const pct = Math.round(correct/16*100);
  let emoji, title, msg;
  if (pct === 100) { emoji='🏆'; title='¡Perfecto!'; msg='¡Todos los verbos correctos! Sos una crack, Sofi 🎉'; }
  else if (pct >= 75) { emoji='⭐'; title='¡Muy bien!'; msg=`${correct} de 16 correctos (${pct}%). ¡Casi perfecto!`; }
  else if (pct >= 50) { emoji='💪'; title='¡Buen intento!'; msg=`${correct} de 16 correctos (${pct}%). Un poco más de práctica y lo tenés.`; }
  else { emoji='📚'; title='Seguí practicando'; msg=`${correct} de 16 correctos (${pct}%). ¡Volvé a intentarlo!`; }
  document.getElementById('finishEmoji').textContent = emoji;
  document.getElementById('finishTitle').textContent = title;
  document.getElementById('finishMsg').textContent = msg;
}

document.addEventListener('keydown', e => { if (e.key==='Enter') checkAnswer(); });

restart();
</script>
</body>
</html>
